services:
  equatis.app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: equatis-app
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', (r) => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      equatis.postgres:
        condition: service_healthy
    networks:
      - proxy
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.equatis.rule=Host(`plateforme.equatisimmobilier.fr`)"
      - "traefik.http.routers.equatis.entrypoints=websecure"
      - "traefik.http.routers.equatis.tls.certresolver=myresolver"
      - "traefik.http.services.equatis.loadbalancer.server.port=3000"

  equatis.postgres:
    image: postgres:17-alpine
    container_name: equatis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: equatis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: equatis
    volumes:
      - equatis_pg_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U equatis -d equatis"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  equatis.minio:
    image: minio/minio:latest
    container_name: equatis-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio_dev_password
    volumes:
      - equatis_minio_data:/data
    healthcheck:
      test:
        ["CMD", "curl", "-fI", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.equatisminio.rule=Host(`equatisminio.equatisimmobilier.fr`)"
      - "traefik.http.routers.equatisminio.entrypoints=websecure"
      - "traefik.http.routers.equatisminio.tls.certresolver=myresolver"
      - "traefik.http.services.equatisminio.loadbalancer.server.port=9000"

  equatis.minio-init:
    image: minio/mc:latest
    container_name: equatis-minio-init
    depends_on:
      equatis.minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://equatis.minio:9000 minio minio_dev_password;
      mc mb --ignore-existing local/equatis-documents-dev;
      mc anonymous set none local/equatis-documents-dev;
      echo 'Bucket equatis-documents-dev prêt';
      "
    restart: "no"
    networks:
      - default

volumes:
  equatis_pg_data:
  equatis_minio_data:

networks:
  default: {}
  proxy:
    external: true